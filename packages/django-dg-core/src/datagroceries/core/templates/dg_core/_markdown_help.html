{% load i18n %}{% comment %}
The writing help the editor's "?" opens under it (editor.js): Markdown, then what the installed apps recognise.
{% endcomment %}<template id="dg-editor-help">
  <div class="dg-editor-help">
    <table>
      <tbody>
        <tr><td><code>**{% translate "bold" %}**</code> <code>*{% translate "italic" %}*</code> <code>~~{% translate "struck" %}~~</code></td>
            <td><strong>{% translate "bold" %}</strong>, <em>{% translate "italic" %}</em>, <del>{% translate "struck" %}</del></td></tr>
        <tr><td><code>## {% translate "Heading" %}</code> <code>### …</code></td>
            <td>{% translate "A heading, and a smaller one under it." %}</td></tr>
        <tr><td><code>- …</code> <code>1. …</code></td>
            <td>{% translate "A list, or a numbered one. Two spaces before the dash put an item under the one above." %}</td></tr>
        <tr><td><code>- [ ] …</code></td><td>{% translate "A list of things to do, with checkboxes." %}</td></tr>
        <tr><td><code>&gt; …</code></td><td>{% translate "A quote." %}</td></tr>
        <tr><td><code>`code`</code> <code>```</code></td>
            <td>{% translate "Code in a sentence; a line of three backticks above and below a block of code." %}</td></tr>
        <tr><td><code>[{% translate "words" %}](https://…)</code></td>
            <td>{% translate "A link. An address on its own becomes a link too." %}</td></tr>
        <tr><td><code>| {% translate "Name" %} | {% translate "Role" %} |</code><br><code>|---|---|</code></td>
            <td>{% translate "A table: a row per line, the second line under the heads." %}</td></tr>
        <tr data-needs-upload><td><code>![{% translate "description" %}](…)</code></td>
            <td>{% translate "An image: paste or drop one into the text, and it is uploaded and put in." %}</td></tr>
        <tr><td>{% translate "Enter" %}</td>
            <td>{% translate "A new line stays a new line; an empty line starts a new paragraph." %}</td></tr>
        {% for example, explanation in references %}
          <tr><td><code>{{ example }}</code></td><td>{{ explanation }}</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</template>
