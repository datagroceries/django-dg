{% load i18n %}{% get_current_language as language %}<!doctype html>
<html lang="{{ language }}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"></head>
{# Styles inline, as many mail programs drop a <style> block. #}
<body style="margin:0;padding:24px 16px;background:#ffffff;color:#212529;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5">
<div style="max-width:600px">
<p style="margin:0 0 16px">{{ message.summary }}</p>
{% if message.quote %}<blockquote style="margin:0 0 16px;padding:8px 12px;border-left:3px solid #dee2e6;color:#495057;white-space:pre-wrap">{{ message.quote }}</blockquote>{% endif %}
<p style="margin:0 0 32px"><a href="{{ message.url }}" style="display:inline-block;padding:6px 14px;border-radius:6px;background:#0d6efd;color:#ffffff;text-decoration:none">{% translate "Open" %}</a></p>
<p style="margin:0;font-size:13px;color:#6c757d">{% blocktranslate with subject=message.subject %}You get this because you watch {{ subject }}.{% endblocktranslate %} <a href="{{ about_url }}" style="color:#6c757d">{% translate "Stop watching on its page" %}</a></p>
</div>
</body>
</html>
