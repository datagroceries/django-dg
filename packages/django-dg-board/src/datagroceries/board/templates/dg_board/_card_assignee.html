{% load i18n dg_board %}
{# A card's assignee, a faint person-plus without one; a click opens the board's assignee picker (card_assignee.js). The name shows beside the photo: small photos in the same company style look alike. #}
<button type="button" class="tk-assignee{% if not ticket.assignee %} tk-assignee-none{% endif %}" data-assign-url="{% url 'dg_board:ticket_update' ticket.pk %}" data-assignee="{{ ticket.assignee_id|default:'' }}" title="{% if ticket.assignee %}{% blocktranslate with person=ticket.assignee|person %}{{ person }}; click to change{% endblocktranslate %}{% else %}{% blocktranslate with key=ticket.key %}Assign {{ key }}{% endblocktranslate %}{% endif %}">{% if ticket.assignee %}{% avatar ticket.assignee 'sm' %}<span class="tk-assignee-name">{{ ticket.assignee|person_short }}</span>{% else %}<i class="bi bi-person-plus"></i>{% endif %}</button>
