{% for node in nodes %}
  <li>
    {% if node.children %}
      <details{% if node.page.pk in open_ids %} open{% endif %}>
        <summary><a href="{{ node.page.get_absolute_url }}" data-page="{{ node.page.pk }}"{% if node.page.pk not in writable %} draggable="false"{% endif %}{% if node.page.pk == current.pk %} aria-current="page"{% endif %}>{{ node.page.title }}</a></summary>
        <ul>{% include 'dg_wiki/_tree_nodes.html' with nodes=node.children %}</ul>
      </details>
    {% else %}
      <a href="{{ node.page.get_absolute_url }}" data-page="{{ node.page.pk }}"{% if node.page.pk not in writable %} draggable="false"{% endif %}{% if node.page.pk == current.pk %} aria-current="page"{% endif %}>{{ node.page.title }}</a>
    {% endif %}
  </li>
{% endfor %}
